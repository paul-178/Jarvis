<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD080">
<title>Goals — Paul's Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg-page: linear-gradient(155deg, #FFECD2 0%, #FFD080 55%, #F4A040 100%);
  --bg-card: rgba(255, 250, 228, 0.92);
  --bg-row:  rgba(255, 243, 210, 0.80);
  --border-card: rgba(210, 148, 42, 0.22);
  --shadow-card: 0 6px 28px rgba(175, 95, 15, 0.11), 0 1px 4px rgba(140, 70, 8, 0.07);
  --text-primary: #1C0A00;
  --text-secondary: rgba(78, 44, 6, 0.72);
  --text-tertiary: rgba(115, 72, 10, 0.48);
  --text-label: rgba(118, 76, 10, 0.52);
  --success: #2CA83C;
  --warning: #F28200;
  --accent: #FF6B2B;
  --accent-orange: #FF8C1A;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius-card: 26px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100vh; font-family: var(--font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
body { background: var(--bg-page); color: var(--text-primary); overflow-x: hidden; }

.page { max-width: 760px; margin: 0 auto; padding: 14px 14px 32px; }

/* page title */
.page-title {
  font-size: 28px; font-weight: 800; letter-spacing: -0.02em;
  color: var(--text-primary); margin-bottom: 4px;
}
.page-sub {
  font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;
}

/* ticker */
.ticker-wrap { margin-bottom: 14px; }
.goal-ticker {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px;
  border-radius: 14px;
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  box-shadow: 0 2px 10px rgba(175,95,15,0.08);
  overflow: hidden; position: relative;
}
.goal-ticker-led { display: inline-flex; align-items: center; }
.goal-ticker-led-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--success);
  box-shadow: 0 0 6px rgba(44,168,60,0.60);
  animation: ledpulse 2.4s ease-in-out infinite;
}
@keyframes ledpulse {
  0%,100% { opacity:1; } 50% { opacity:0.45; }
}
.goal-ticker-label {
  font-family: var(--font-mono); font-size: 9px; font-weight: 800;
  letter-spacing: 0.20em; color: var(--text-label); text-transform: uppercase; white-space: nowrap;
}
.goal-ticker-stage { flex: 1; overflow: hidden; min-width: 0; }
.goal-ticker-row { display: flex; align-items: center; gap: 8px; transition: opacity 0.22s ease; }
.goal-ticker-row.is-fading { opacity: 0; }
.goal-ticker-status { font-size: 13px; font-weight: 700; min-width: 14px; flex-shrink: 0; color: var(--text-tertiary); }
.goal-ticker-status[data-status="done"]    { color: var(--success); }
.goal-ticker-status[data-status="pending"] { color: var(--accent-orange); }
.goal-ticker-text {
  font-size: 13px; font-weight: 500; color: var(--text-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.goal-ticker-meta {
  font-family: var(--font-mono); font-size: 12px; font-weight: 800;
  color: var(--text-label); white-space: nowrap; flex-shrink: 0;
}

/* goal cards */
.gm-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: 20px;
  margin-bottom: 12px;
  transition: border-color 0.3s;
}
.gm-card.gm-all-done { border-color: rgba(44,168,60,0.40); }
.gm-card-tomorrow { opacity: 0.88; }

.gm-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 14px; gap: 12px;
}
.gm-header-left { flex: 1; min-width: 0; }
.gm-eyebrow { font-family: var(--font-mono); font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-label); margin-bottom: 4px; }
.gm-progress-row { display: flex; align-items: baseline; gap: 4px; }
.gm-progress-num   { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.gm-progress-total { font-size: 18px; font-weight: 600; color: var(--text-tertiary); }
.gm-progress-label { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-left: 6px; }
.gm-tomorrow-sub   { font-size: 12px; color: var(--text-tertiary); margin-top: 3px; }
.gm-tomorrow-count { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--text-tertiary); letter-spacing: 0.08em; white-space: nowrap; margin-top: 4px; }

.gm-streak {
  display: flex; align-items: center; gap: 4px; padding: 6px 10px;
  border-radius: 12px; border: 1px solid var(--border-card);
  background: rgba(255,240,198,0.60);
  font-size: 12px; font-weight: 600; color: var(--text-tertiary);
  white-space: nowrap; flex-shrink: 0;
}
.gm-streak-icon { font-size: 14px; opacity: 0.5; }
.gm-streak-num  { font-family: var(--font-mono); font-size: 14px; font-weight: 800; color: var(--text-secondary); }
.gm-streak.gm-streak-active { border-color: rgba(242,130,0,0.40); background: rgba(255,185,60,0.18); }
.gm-streak.gm-streak-active .gm-streak-icon { opacity: 1; }
.gm-streak.gm-streak-active .gm-streak-num  { color: var(--warning); }

.gm-bar { display: flex; gap: 3px; margin-bottom: 14px; height: 5px; }
.gm-bar-seg { flex: 1; border-radius: 99px; background: rgba(200,148,42,0.20); transition: background 0.3s; }
.gm-bar-seg-done { background: var(--success); }

/* goal list rows */
.gm-list { list-style: none; margin: 0 0 10px; padding: 0; }
.gm-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px;
  border-radius: 12px;
  background: var(--bg-row);
  border: 1px solid rgba(210,148,42,0.14);
  margin-bottom: 5px;
  cursor: default;
  transition: background 0.15s, opacity 0.25s;
}
.gm-row.gm-row-done { opacity: 0.55; }
.gm-row.gm-row-queued { border-color: rgba(255,140,26,0.40); }
.gm-row.is-drag-over  { background: rgba(255,210,100,0.28); outline: 2px dashed var(--accent-orange); outline-offset: 1px; }
.gm-row.is-queue-flashing { background: rgba(255,210,100,0.35); }
.gm-handle { color: var(--text-tertiary); font-size: 12px; cursor: grab; flex-shrink: 0; user-select: none; letter-spacing: -2px; }

.gm-check {
  appearance: none; -webkit-appearance: none;
  width: 20px; height: 20px; flex-shrink: 0;
  border: 1.5px solid rgba(160,110,28,0.38);
  background: rgba(255,244,210,0.70);
  border-radius: 6px; cursor: pointer;
  transition: background 0.15s, border-color 0.15s; position: relative;
}
.gm-check:checked { background: var(--success); border-color: var(--success); }
.gm-check:checked::after {
  content: ''; position: absolute; left: 6px; top: 3px;
  width: 6px; height: 10px; border: solid #FFF; border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
}
.gm-check:disabled { opacity: 0.45; cursor: default; }

.gm-text {
  flex: 1; font-size: 14px; font-weight: 500; color: var(--text-primary);
  word-break: break-word; outline: none;
}
.gm-row.gm-row-done .gm-text { text-decoration: line-through; color: var(--text-tertiary); }
.gm-text[contenteditable="true"] {
  background: rgba(255,238,168,0.55); border-radius: 5px;
  padding: 1px 5px; margin: -1px -5px; outline: 2px solid var(--accent-orange);
}

.gm-queue-btn {
  background: transparent; border: none; font-size: 13px; cursor: pointer; padding: 0 2px;
  opacity: 0.35; transition: opacity 0.15s;
}
.gm-queue-btn:hover, .gm-queue-btn.gm-queue-active { opacity: 1; }
.gm-queue-btn:disabled { cursor: default; opacity: 0.2; }

.goal-delete {
  background: transparent; border: none;
  color: var(--text-tertiary); cursor: pointer;
  font-size: 18px; font-weight: 400; line-height: 1; padding: 0 3px;
  border-radius: 6px; opacity: 0.45; transition: opacity 0.15s, color 0.15s;
  flex-shrink: 0;
}
.goal-delete:hover { opacity: 1; color: #D03030; }

.gm-show-toggle {
  display: block; width: 100%; padding: 6px; margin-top: 4px;
  background: transparent; border: 1px dashed rgba(210,148,42,0.30);
  border-radius: 10px; color: var(--text-tertiary); font-family: var(--font);
  font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s;
}
.gm-show-toggle:hover { background: rgba(255,220,120,0.20); }

/* input area */
.gm-input-wrap {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px;
}
.gm-input {
  flex: 1 1 180px; min-width: 0;
  padding: 10px 14px;
  background: rgba(255,244,210,0.70);
  border: 1.5px solid rgba(210,148,42,0.28);
  border-radius: 12px;
  font-family: var(--font); font-size: 14px; color: var(--text-primary);
  outline: none; transition: border-color 0.2s, background 0.2s;
}
.gm-input:focus { border-color: rgba(255,140,26,0.60); background: rgba(255,248,220,0.85); }
.gm-input::placeholder { color: var(--text-tertiary); }
.gm-add, .gm-polish {
  padding: 10px 16px; border: none; border-radius: 12px;
  font-family: var(--font); font-size: 13px; font-weight: 700;
  cursor: pointer; white-space: nowrap; transition: background 0.15s, transform 0.10s;
}
.gm-add { background: rgba(255,140,26,0.20); color: var(--accent-orange); }
.gm-add:hover { background: rgba(255,140,26,0.30); }
.gm-polish { background: rgba(255,180,80,0.18); color: rgba(180,100,10,0.85); }
.gm-polish:hover { background: rgba(255,180,80,0.30); }
.gm-add:active, .gm-polish:active { transform: scale(0.97); }
.gm-status { width: 100%; font-size: 11px; color: var(--text-tertiary); font-style: italic; }
.gm-status.gm-status-error { color: #D03030; }

/* push btn */
.gm-push-btn {
  display: none; width: 100%; padding: 9px;
  margin: 8px 0 4px;
  background: rgba(210,148,42,0.12);
  border: 1px dashed rgba(210,148,42,0.35);
  border-radius: 12px;
  color: var(--text-secondary); font-family: var(--font); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: background 0.15s;
}
.gm-push-btn:hover { background: rgba(210,148,42,0.22); }

/* empty state */
.empty-state { font-size: 12px; color: var(--text-tertiary); font-style: italic; padding: 4px 0; display: none; }

@media (max-width: 480px) {
  .page { padding: 10px 10px 28px; }
  .gm-card { padding: 16px; }
  .gm-progress-num { font-size: 26px; }
}
</style>
</head>
<body>
<div class="page">

  <h1 class="page-title">🎯 Goals</h1>
  <p class="page-sub">Today's tasks, tomorrow's plan.</p>

  <div class="ticker-wrap">
    <div class="goal-ticker" id="goalTicker" aria-live="polite" aria-atomic="true">
      <div class="goal-ticker-led"><span class="goal-ticker-led-dot"></span></div>
      <div class="goal-ticker-label">TODAY</div>
      <div class="goal-ticker-stage" id="goalTickerStage">
        <div class="goal-ticker-row">
          <span class="goal-ticker-status" data-status="">·</span>
          <span class="goal-ticker-text">Loading…</span>
        </div>
      </div>
      <div class="goal-ticker-meta" id="goalTickerMeta">0/0</div>
    </div>
  </div>

  <!-- TODAY -->
  <div class="gm-card" id="gmCardToday">
    <div class="gm-header">
      <div class="gm-header-left">
        <div class="gm-eyebrow" id="todayLabel">Today —</div>
        <div class="gm-progress-row">
          <span class="gm-progress-num"   id="gmProgressNum">0</span>
          <span class="gm-progress-total" id="gmProgressTotal">/ 0</span>
          <span class="gm-progress-label" id="gmProgressLabel">no goals yet</span>
        </div>
      </div>
      <div class="gm-streak" id="gmStreak">
        <span class="gm-streak-icon">⚡</span>
        <span class="gm-streak-num" id="gmStreakNum">0</span>
        <span>day streak</span>
      </div>
    </div>
    <div class="gm-bar" id="gmBar"></div>
    <ul id="goalList" class="goal-list gm-list"></ul>
    <div id="emptyState" class="empty-state">No goals for today yet — add one below.</div>
    <button type="button" id="gmPushBtn" class="gm-push-btn">Push remaining to tomorrow</button>
    <div class="gm-input-wrap">
      <input id="goalInput" class="gm-input" type="text" placeholder="Add a goal for today…" autocomplete="off">
      <button type="button" id="goalAddBtn"    class="gm-add">+ Add</button>
      <button type="button" id="goalPolishBtn" class="gm-polish">✨ Polish</button>
      <div class="gm-status" id="polishStatus"></div>
    </div>
  </div>

  <!-- PLAN TOMORROW -->
  <div class="gm-card gm-card-tomorrow" id="gmCardTomorrow">
    <div class="gm-header">
      <div class="gm-header-left">
        <div class="gm-eyebrow" id="tomorrowLabel">Plan tomorrow —</div>
        <div class="gm-tomorrow-sub">Write tonight, locked until 6 AM.</div>
      </div>
      <div class="gm-tomorrow-count" id="gmTomorrowCount">0 planned</div>
    </div>
    <ul id="tomorrowList" class="goal-list gm-list"></ul>
    <div id="tomorrowEmpty" class="empty-state">Nothing planned for tomorrow yet</div>
    <div class="gm-input-wrap">
      <input id="tomorrowInput" class="gm-input" type="text" placeholder="Add a goal for tomorrow…" autocomplete="off">
      <button type="button" id="tomorrowAddBtn"    class="gm-add">+ Add</button>
      <button type="button" id="tomorrowPolishBtn" class="gm-polish">✨ Polish</button>
      <div class="gm-status" id="tomorrowStatus"></div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  const ANTHROPIC_API_KEY = '';
  const WAKE_HOUR  = 6;

  function storeGet(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }
  function storeSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    if (typeof key === 'string' && key.indexOf('goals:') === 0) window.dispatchEvent(new CustomEvent('goals-changed'));
  }
  function storeDelete(key) { try { localStorage.removeItem(key); } catch {} }
  function storeListKeys(prefix) {
    const out = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(prefix) === 0) out.push(k); }
    return out;
  }
  function pad2(n) { return String(n).padStart(2,'0'); }
  function dateToKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function getActiveDateString() {
    const now = new Date();
    if (now.getHours() < WAKE_HOUR) { const d = new Date(now); d.setDate(d.getDate()-1); return dateToKey(d); }
    return dateToKey(now);
  }
  function getTomorrowDateString() {
    const now = new Date(); const d = new Date(now);
    if (now.getHours() >= WAKE_HOUR) d.setDate(d.getDate()+1);
    return dateToKey(d);
  }
  function formatDate(s) {
    const p = s.split('-').map(Number); const d = new Date(p[0], p[1]-1, p[2]);
    const wk = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    return wk + ', ' + mo + ' ' + d.getDate();
  }
  function todayKey()    { return 'goals:' + getActiveDateString(); }
  function tomorrowKey() { return 'goals:' + getTomorrowDateString(); }
  function getGoals(key) { const g = storeGet(key); return Array.isArray(g) ? g : []; }
  function setGoals(key, list) { storeSet(key, list); }

  // rollover
  function rollover() {
    const todayDateStr = getActiveDateString(); const todayK = 'goals:' + todayDateStr;
    let today = getGoals(todayK); const texts = new Set(today.map(g => g.text));
    storeListKeys('goals:').forEach(k => {
      const dateStr = k.slice('goals:'.length); if (dateStr >= todayDateStr) return;
      const old = getGoals(k);
      old.forEach(g => { if (!g.done && g.text && !texts.has(g.text)) { today.push({text:g.text,done:false}); texts.add(g.text); } });
      storeDelete(k);
    });
    setGoals(todayK, today);
  }

  // streak
  function loadStreak() { const s = storeGet('goal_streak_v1'); return (s && typeof s.count === 'number') ? s : {count:0,lastProcessedDate:''}; }
  function saveStreak(s) { storeSet('goal_streak_v1', s); }
  function processStreak() {
    const s = loadStreak(); const todayDateStr = getActiveDateString();
    const keys = storeListKeys('goals:').map(k=>k.slice('goals:'.length)).filter(d=>d<todayDateStr).sort();
    keys.forEach(dateStr => {
      if (s.lastProcessedDate && dateStr <= s.lastProcessedDate) return;
      const list = getGoals('goals:'+dateStr);
      if (list.length === 0) {} else if (list.every(g=>g.done)) s.count++; else s.count = 0;
      s.lastProcessedDate = dateStr;
    });
    saveStreak(s);
  }

  // ticker
  const tickerStage = document.getElementById('goalTickerStage');
  const tickerMeta  = document.getElementById('goalTickerMeta');
  let cycleIdx = 0, tickerTimer = null;
  function buildTickerItems() {
    const goals = getGoals(todayKey()); const total = goals.length; const done = goals.filter(g=>g.done).length;
    if (total === 0) return {items:[{status:'empty',text:'No goals set for today — add one to get rolling.'}],done,total};
    if (done === total) return {items:[{status:'done',text:'✓ All goals done — solid day.'}],done,total};
    return {items:goals.filter(g=>!g.done).map(g=>({status:'pending',text:g.text})),done,total};
  }
  function statusGlyph(s) { return s==='done'?'✓':s==='pending'?'○':'·'; }
  let firstTick = true;
  function tick() {
    const {items,done,total} = buildTickerItems();
    if (cycleIdx >= items.length) cycleIdx = 0;
    const item = items[cycleIdx]; cycleIdx = (cycleIdx+1) % items.length;
    tickerMeta.textContent = done+'/'+total;
    let row = tickerStage.querySelector('.goal-ticker-row');
    if (!row) {
      row = document.createElement('div'); row.className = 'goal-ticker-row';
      row.innerHTML = '<span class="goal-ticker-status"></span><span class="goal-ticker-text"></span>';
      tickerStage.appendChild(row);
    }
    const statusEl = row.querySelector('.goal-ticker-status');
    const textEl   = row.querySelector('.goal-ticker-text');
    const apply = () => { statusEl.setAttribute('data-status',item.status); statusEl.textContent=statusGlyph(item.status); textEl.textContent=item.text; row.classList.remove('is-fading'); };
    if (firstTick) { apply(); firstTick=false; return; }
    row.classList.add('is-fading'); setTimeout(apply, 220);
  }
  function startTicker() { tick(); if (tickerTimer) clearInterval(tickerTimer); tickerTimer = setInterval(tick, 5000); }
  window.addEventListener('goals-changed', () => { cycleIdx=0; tick(); });

  // inline edit
  function makeInlineEdit(textEl, _goals, idx, key, reload) {
    textEl.addEventListener('click', () => {
      if (textEl.getAttribute('contenteditable') === 'true') return;
      const original = textEl.textContent;
      textEl.setAttribute('contenteditable','true'); textEl.focus();
      const range = document.createRange(); range.selectNodeContents(textEl); range.collapse(false);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      function commit() {
        const next = textEl.textContent.trim(); textEl.removeAttribute('contenteditable');
        if (next && next !== original) { const list = getGoals(key); if (list[idx]) { list[idx].text=next; setGoals(key,list); } reload(); }
        else textEl.textContent = original;
      }
      textEl.addEventListener('blur', commit, {once:true});
      textEl.addEventListener('keydown', function onKey(e) {
        if (e.key==='Enter') {e.preventDefault();textEl.removeEventListener('keydown',onKey);textEl.blur();}
        else if (e.key==='Escape') {e.preventDefault();textEl.removeEventListener('keydown',onKey);textEl.removeAttribute('contenteditable');textEl.textContent=original;}
      });
    });
  }

  // drag-reorder
  function wireDragReorder(row, _listEl, key, reload) {
    row.setAttribute('draggable','true');
    row.addEventListener('dragstart', e => { e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',row.dataset.idx); });
    row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('is-drag-over'); });
    row.addEventListener('dragleave', () => row.classList.remove('is-drag-over'));
    row.addEventListener('drop', e => {
      e.preventDefault(); row.classList.remove('is-drag-over');
      const from = parseInt(e.dataTransfer.getData('text/plain'),10); const to = parseInt(row.dataset.idx,10);
      if (isNaN(from)||isNaN(to)||from===to) return;
      const list = getGoals(key); const [moved] = list.splice(from,1); list.splice(to,0,moved);
      setGoals(key,list); reload();
    });
  }

  function buildGoalRow(goal, idx, key, readOnly, reload) {
    const li = document.createElement('li'); li.className = 'gm-row'; li.dataset.idx = String(idx);
    if (goal.done) li.classList.add('gm-row-done');
    if (goal.queued) li.classList.add('gm-row-queued');

    const handle = document.createElement('span'); handle.className = 'gm-handle'; handle.textContent = '⋮⋮'; li.appendChild(handle);

    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.className = 'gm-check'; cb.checked = !!goal.done;
    if (readOnly) { cb.disabled = true; cb.title = 'Activates at 6 AM tomorrow'; }
    cb.addEventListener('change', () => {
      const list = getGoals(key); if (!list[idx]) return;
      list[idx].done = cb.checked;
      if (cb.checked) list[idx].doneAt = Date.now(); else delete list[idx].doneAt;
      setGoals(key,list); reload();
    });
    li.appendChild(cb);

    const text = document.createElement('span'); text.className = 'gm-text'; text.textContent = goal.text; li.appendChild(text);
    makeInlineEdit(text, null, idx, key, reload);

    const queueBtn = document.createElement('button'); queueBtn.type='button';
    queueBtn.className = 'gm-queue-btn' + (goal.queued?' gm-queue-active':''); queueBtn.textContent = '⚡';
    queueBtn.title = 'Queue for productivity window'; if (readOnly) queueBtn.disabled = true;
    queueBtn.addEventListener('click', () => {
      const list = getGoals(key); if (!list[idx]) return; list[idx].queued = !list[idx].queued;
      setGoals(key,list); li.classList.add('is-queue-flashing'); setTimeout(reload,480);
    });
    li.appendChild(queueBtn);

    const del = document.createElement('button'); del.type='button'; del.className='goal-delete';
    del.setAttribute('aria-label','Delete goal'); del.textContent='×';
    del.addEventListener('click', () => { const list=getGoals(key); list.splice(idx,1); setGoals(key,list); reload(); });
    li.appendChild(del);

    wireDragReorder(li, null, key, reload);
    return li;
  }

  // renderers
  function renderTodayHeader() {
    const goals = getGoals(todayKey()); const total = goals.length; const done = goals.filter(g=>g.done).length;
    document.getElementById('gmProgressNum').textContent   = done;
    document.getElementById('gmProgressTotal').textContent = '/ '+total;
    const label = document.getElementById('gmProgressLabel');
    if (total===0) label.textContent='no goals yet';
    else if (done===total) label.textContent='all done — solid day';
    else label.textContent='complete';
    document.getElementById('todayLabel').textContent = 'Today — '+formatDate(getActiveDateString());
    const bar = document.getElementById('gmBar'); bar.innerHTML = '';
    goals.forEach(g => { const seg=document.createElement('div'); seg.className='gm-bar-seg'+(g.done?' gm-bar-seg-done':''); bar.appendChild(seg); });
    document.getElementById('gmCardToday').classList.toggle('gm-all-done', total>0&&done===total);
    document.getElementById('gmPushBtn').style.display = (total>0&&done<total)?'block':'none';
  }
  function renderStreak() {
    const s = loadStreak();
    document.getElementById('gmStreakNum').textContent = s.count;
    document.getElementById('gmStreak').classList.toggle('gm-streak-active', s.count>0);
  }
  function renderTomorrowCount() {
    const list = getGoals(tomorrowKey());
    document.getElementById('gmTomorrowCount').textContent = list.length+' planned';
    document.getElementById('tomorrowLabel').textContent = 'Plan tomorrow — '+formatDate(getTomorrowDateString());
  }
  function renderListInto(goals, listEl, emptyEl, key, readOnly) {
    listEl.innerHTML = '';
    emptyEl.style.display = goals.length===0?'block':'none';
    const reload = () => (key===todayKey()?loadToday():loadTomorrow());
    const visible = goals.length > 5 ? goals.slice(0,5) : goals;
    visible.forEach((g,i) => listEl.appendChild(buildGoalRow(g,i,key,readOnly,reload)));
    if (goals.length > 5) {
      let expanded = false;
      const toggle = document.createElement('button'); toggle.type='button'; toggle.className='gm-show-toggle';
      const updateLabel = () => { toggle.textContent = expanded?'Show less ▴':('Show '+(goals.length-5)+' more ▾'); };
      updateLabel();
      toggle.addEventListener('click', () => {
        expanded = !expanded;
        if (expanded) { goals.slice(5).forEach((g,i) => { const row=buildGoalRow(g,i+5,key,readOnly,reload); listEl.insertBefore(row,toggle); }); }
        else { Array.from(listEl.querySelectorAll('.gm-row')).slice(5).forEach(r=>r.remove()); }
        updateLabel();
      });
      listEl.appendChild(toggle);
    }
    if (key===todayKey()) renderTodayHeader(); else renderTomorrowCount();
  }
  function loadToday() {
    const goals = getGoals(todayKey());
    renderListInto(goals, document.getElementById('goalList'), document.getElementById('emptyState'), todayKey(), false);
  }
  function loadTomorrow() {
    const goals = getGoals(tomorrowKey());
    renderListInto(goals, document.getElementById('tomorrowList'), document.getElementById('tomorrowEmpty'), tomorrowKey(), true);
  }

  // push remaining
  document.getElementById('gmPushBtn').addEventListener('click', () => {
    const today = getGoals(todayKey()); const remaining = today.filter(g=>!g.done);
    if (!remaining.length) return;
    if (!confirm('Move '+remaining.length+' unchecked goal'+(remaining.length===1?'':'s')+' to tomorrow?')) return;
    const tomorrow = getGoals(tomorrowKey()); const seen = new Set(tomorrow.map(g=>g.text));
    remaining.forEach(g => { if (!seen.has(g.text)) { tomorrow.push({text:g.text,done:false}); seen.add(g.text); } });
    setGoals(tomorrowKey(),tomorrow); setGoals(todayKey(),today.filter(g=>g.done));
    loadToday(); loadTomorrow();
  });

  // add + polish
  function showStatus(el, msg, isErr) {
    el.textContent=msg; el.classList.toggle('gm-status-error',!!isErr);
    clearTimeout(el._t); el._t=setTimeout(()=>{el.textContent='';el.classList.remove('gm-status-error');},3500);
  }
  async function polishOne(text) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':ANTHROPIC_API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1000,messages:[{role:'user',content:'Rewrite this single goal so it is concrete, action-oriented, and under 60 characters. Return ONLY a JSON array with exactly one string, no preamble, no code fences.\n\nGoal: '+text}]})
    });
    const data = await res.json();
    const content = (data&&data.content&&data.content[0]&&data.content[0].text)||'';
    const arr = JSON.parse(content);
    if (!Array.isArray(arr)||arr.length<1||typeof arr[0]!=='string') throw new Error('bad');
    return arr[0].trim();
  }
  function makeAddHandlers(input, addBtn, polishBtn, key, statusEl, reload) {
    function plainAdd(text) { const list=getGoals(key); list.push({text,done:false}); setGoals(key,list); input.value=''; reload(); }
    addBtn.addEventListener('click', () => { const t=input.value.trim(); if(t) plainAdd(t); });
    input.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();addBtn.click();} });
    polishBtn.addEventListener('click', async () => {
      const t = input.value.trim(); if (!t) return;
      if (!ANTHROPIC_API_KEY) { plainAdd(t); showStatus(statusEl,'Polish needs an API key — added as-typed.',false); return; }
      polishBtn.disabled=true;
      try { plainAdd(await polishOne(t)); }
      catch { plainAdd(t); showStatus(statusEl,'Polish failed — added as-typed.',true); }
      finally { polishBtn.disabled=false; }
    });
  }
  makeAddHandlers(document.getElementById('goalInput'),document.getElementById('goalAddBtn'),document.getElementById('goalPolishBtn'),todayKey(),document.getElementById('polishStatus'),loadToday);
  makeAddHandlers(document.getElementById('tomorrowInput'),document.getElementById('tomorrowAddBtn'),document.getElementById('tomorrowPolishBtn'),tomorrowKey(),document.getElementById('tomorrowStatus'),loadTomorrow);

  // boot
  rollover(); processStreak();
  loadToday(); loadTomorrow(); renderStreak(); startTicker();
  window.addEventListener('storage', () => { loadToday(); loadTomorrow(); renderStreak(); });
})();
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (typeof initCloudSync !== 'function') return;
  initCloudSync({
    appKey: 'main',
    syncedPrefixes: ['goals:'],
    syncedKeys: ['acad:grades', 'acad:events', 'acad:todos', 'acad:planner',
                 'nw:bank', 'nw:stocks', 'nw:crypto', 'nw:other', 'subs',
                 'po_water_v1', 'goal_streak_v1', 'nw_currency'],
    onApplied: function () {
      window.dispatchEvent(new CustomEvent('goals-changed'));
      window.dispatchEvent(new Event('storage'));
    }
  });
});
</script>
